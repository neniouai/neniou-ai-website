<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neniou AI</title>
<meta name="description" content="Neniou AI — your multilingual AI assistant.">
<link rel="icon" href="/assets/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f11;
    --bg-elevated: #1b1c1f;
    --bg-input: #1e1f22;
    --bg-hover: #262729;
    --border: #303134;
    --text: #e3e3e3;
    --text-dim: #9aa0a6;
    --accent-blue: #4a8fe7;
    --accent-teal: #2fbf9f;
    --accent-green: #34c98a;
    --error: #f28b82;
    --radius: 26px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', 'Google Sans', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    height: 100vh;
    overflow: hidden;
  }

  /* ================= APP (CHAT) ================= */
  .app { display: none; height: 100vh; }
  .app.visible { display: flex; }

  /* ---- Sidebar with conversation list ---- */
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    padding: 16px 12px;
    border-right: 1px solid var(--border);
    transition: width .2s ease, padding .2s ease, opacity .15s ease;
    overflow: hidden;
  }
  .sidebar.collapsed {
    width: 0;
    padding-left: 0;
    padding-right: 0;
    border-right: none;
    opacity: 0;
    pointer-events: none;
  }

  .sidebar-top { display: flex; align-items: center; gap: 10px; padding: 4px 6px 18px; }
  .sidebar-top img { width: 26px; height: 26px; object-fit: contain; }
  .sidebar-top span { font-weight: 600; font-size: 0.95rem; }

  .new-chat-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 0.88rem;
    font-family: inherit;
    cursor: pointer;
    margin-bottom: 14px;
    transition: background .15s;
  }
  .new-chat-btn:hover { background: var(--bg-hover); }
  .new-chat-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

  .conversation-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .conversation-list::-webkit-scrollbar { width: 5px; }
  .conversation-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

  .conversation-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    border-radius: 10px;
    font-size: 0.85rem;
    color: var(--text-dim);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background .15s, color .15s;
  }
  .conversation-item:hover { background: var(--bg-elevated); color: var(--text); }
  .conversation-item.active { background: var(--bg-elevated); color: var(--text); }

  .sidebar-empty { color: var(--text-dim); font-size: 0.78rem; padding: 12px; text-align: center; }

  /* ---- Main area ---- */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; }
  .topbar-left { display: flex; align-items: center; gap: 14px; }
  .sidebar-toggle-btn {
    width: 34px; height: 34px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .sidebar-toggle-btn:hover { background: var(--bg-elevated); color: var(--text); }
  .sidebar-toggle-btn svg { width: 20px; height: 20px; }
  .topbar-user { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--text-dim); }
  .logout-btn {
    background: none; border: 1px solid var(--border); color: var(--text-dim);
    padding: 6px 14px; border-radius: 100px; font-size: 0.8rem; cursor: pointer;
  }
  .logout-btn:hover { color: var(--text); border-color: var(--text-dim); }

  .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 20px; }
  .stage.hidden { display: none; }

  .greeting {
    font-family: 'Google Sans', 'Inter', sans-serif;
    font-size: clamp(1.7rem, 4vw, 2.4rem);
    font-weight: 400;
    text-align: center;
    margin: 0 0 32px;
    background: linear-gradient(100deg, var(--accent-blue) 10%, var(--accent-teal) 55%, var(--accent-green) 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .thread-wrap { flex: 1; overflow-y: auto; display: flex; justify-content: center; }
  .thread-wrap.hidden { display: none; }

  .thread { width: 100%; max-width: 780px; padding: 24px 20px 12px; display: flex; flex-direction: column; gap: 26px; }

  .msg-row { display: flex; gap: 14px; align-items: flex-start; }
  .msg-row.user { justify-content: flex-end; }

  .msg-avatar {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
    display: flex; align-items: center; justify-content: center;
  }
  .msg-avatar img { width: 16px; height: 16px; object-fit: contain; }

  .bubble { max-width: 74%; padding: 12px 16px; border-radius: 18px; font-size: 0.96rem; line-height: 1.6; white-space: pre-wrap; }
  .msg-row.user .bubble { background: var(--bg-elevated); border: 1px solid var(--border); border-bottom-right-radius: 4px; }
  .msg-row.bot .bubble { background: transparent; padding: 6px 0; color: var(--text); }

  .typing-dots { display: flex; gap: 5px; padding: 10px 0; }
  .typing-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); animation: bounce 1.1s infinite ease-in-out; }
  .typing-dots span:nth-child(2) { animation-delay: .15s; }
  .typing-dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

  .input-zone { padding: 10px 20px 22px; display: flex; justify-content: center; }
  .input-bar {
    width: 100%; max-width: 780px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex; align-items: center; gap: 10px;
    padding: 8px 8px 8px 20px;
    transition: border-color .15s;
  }
  .input-bar:focus-within { border-color: #4a4d51; }
  .input-bar input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-size: 0.98rem; font-family: inherit; padding: 10px 0;
  }
  .input-bar input::placeholder { color: var(--text-dim); }

  .send-btn {
    width: 38px; height: 38px; border-radius: 50%; border: none;
    background: var(--bg-elevated); color: var(--text-dim);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    transition: background .15s, color .15s;
  }
  .send-btn:not(:disabled):hover { background: #303134; color: var(--text); }
  .send-btn:disabled { opacity: .4; cursor: default; }
  .send-btn svg { width: 18px; height: 18px; }

  .disclaimer { text-align: center; font-size: 0.72rem; color: var(--text-dim); padding-bottom: 14px; }

  @media (max-width: 780px) {
    .bubble { max-width: 88%; }
  }

  @media (max-width: 640px) {
    /* On phones, the sidebar is ALWAYS a hidden slide-in drawer by default —
       this doesn't depend on the 'collapsed' class used on desktop, so there's
       no conflict and no flash of the wrong state on load. */
    .sidebar {
      position: fixed;
      top: 0; left: 0;
      height: 100vh;
      width: 260px;
      z-index: 50;
      background: var(--bg);
      box-shadow: 4px 0 24px rgba(0,0,0,0.4);
      transform: translateX(-100%);
      transition: transform .2s ease;
      opacity: 1;
      pointer-events: auto;
      padding: 16px 12px;
      border-right: 1px solid var(--border);
    }
    .sidebar.mobile-open {
      transform: translateX(0);
    }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 40;
    }
    .sidebar-backdrop.visible { display: block; }

    .topbar { padding: 12px 16px; }
    .input-zone { padding: 8px 12px 16px; }
    .input-bar input { font-size: 16px; } /* prevents iOS auto-zoom on focus */
    .thread { padding: 16px 14px 8px; }
    .bubble { max-width: 92%; font-size: 0.94rem; }
  }
</style>
</head>
<body>

<!-- ================= CHAT APP ================= -->
<div class="app visible" id="app">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <img src="/assets/icon.svg" alt="Neniou AI">
      <span>Neniou AI</span>
    </div>

    <button class="new-chat-btn" onclick="createNewConversation()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
      Nouvelle conversation
    </button>

    <div class="conversation-list" id="conversation-list">
      <div class="sidebar-empty">Aucune conversation pour l'instant</div>
    </div>
  </aside>

  <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="toggleSidebar()"></div>

  <main>
    <div class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle-btn" onclick="toggleSidebar()" title="Afficher/masquer la barre latérale">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
        </button>
        <span style="font-size:0.95rem; color:var(--text-dim);">Chat direct avec Neniou AI</span>
      </div>
    </div>

    <div class="stage" id="stage">
      <div class="greeting">Bonjour, que puis-je faire pour vous aujourd'hui ?</div>
    </div>

    <div class="thread-wrap hidden" id="thread-wrap">
      <div class="thread" id="thread"></div>
    </div>

    <div class="input-zone">
      <form class="input-bar" id="chat-form">
        <input id="chat-input" type="text" placeholder="Écrivez un message pour Neniou AI..." autocomplete="off" />
        <button class="send-btn" id="send-btn" type="submit" disabled aria-label="Envoyer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>
    </div>
    <div class="disclaimer">Neniou AI peut faire des erreurs. Vérifiez les informations importantes.</div>
  </main>

</div>

<script>
  // ===================== SIDEBAR TOGGLE =====================
  function isMobileWidth() {
    return window.innerWidth <= 640;
  }

  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('sidebar-backdrop');

    if (isMobileWidth()) {
      // On phones: the sidebar is hidden by default (pure CSS). Toggling just
      // adds/removes 'mobile-open' to slide it in, independent of 'collapsed'.
      sidebar.classList.toggle('mobile-open');
      backdrop.classList.toggle('visible', sidebar.classList.contains('mobile-open'));
    } else {
      sidebar.classList.toggle('collapsed');
      const isCollapsed = sidebar.classList.contains('collapsed');
      localStorage.setItem('neniou_sidebar_collapsed', isCollapsed ? '1' : '0');
    }
  }

  (function restoreSidebarState() {
    // Only restore the desktop collapsed preference. On phones, the sidebar
    // is always hidden by default via CSS — no class needed on load.
    if (!isMobileWidth() && localStorage.getItem('neniou_sidebar_collapsed') === '1') {
      document.getElementById('sidebar').classList.add('collapsed');
    }
  })();

  // ===================== SESSION STATE =====================
  let currentConversationId = null;

  function startApp() {
    document.getElementById('app').classList.add('visible');
  }

  // ===================== CHAT UI HELPERS =====================
  const stage = document.getElementById('stage');
  const threadWrap = document.getElementById('thread-wrap');
  const thread = document.getElementById('thread');
  const form = document.getElementById('chat-form');
  const input = document.getElementById('chat-input');
  const sendBtn = document.getElementById('send-btn');
  const conversationListEl = document.getElementById('conversation-list');

  input.addEventListener('input', () => {
    sendBtn.disabled = input.value.trim().length === 0;
  });

  function addMessage(text, role) {
    const row = document.createElement('div');
    row.className = 'msg-row ' + role;

    if (role === 'bot') {
      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.innerHTML = '<img src="/assets/icon.svg" alt="">';
      row.appendChild(avatar);
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);

    thread.appendChild(row);
    threadWrap.scrollTop = threadWrap.scrollHeight;
    return bubble;
  }

  function addTypingIndicator() {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.innerHTML = '<img src="/assets/icon.svg" alt="">';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
    row.appendChild(avatar);
    row.appendChild(bubble);
    thread.appendChild(row);
    threadWrap.scrollTop = threadWrap.scrollHeight;
    return row;
  }

  function showThreadView() {
    stage.classList.add('hidden');
    threadWrap.classList.remove('hidden');
  }

  function resetThreadView() {
    thread.innerHTML = '';
    threadWrap.classList.add('hidden');
    stage.classList.remove('hidden');
  }

  // ===================== CONVERSATIONS (sidebar) =====================
  async function loadConversationList() {
    const response = await fetch('/api/conversations');
    if (!response.ok) return [];
    const data = await response.json();
    return data.conversations || [];
  }

  function renderConversationList(conversations) {
    conversationListEl.innerHTML = '';

    if (conversations.length === 0) {
      conversationListEl.innerHTML = "<div class=\"sidebar-empty\">Aucune conversation pour l'instant</div>";
      return;
    }

    for (const conv of conversations) {
      const item = document.createElement('div');
      item.className = 'conversation-item' + (conv.id === currentConversationId ? ' active' : '');
      item.textContent = conv.title || 'New chat';
      item.title = conv.title || 'New chat';
      item.onclick = () => openConversation(conv.id);
      conversationListEl.appendChild(item);
    }
  }

  async function refreshSidebar() {
    const conversations = await loadConversationList();
    renderConversationList(conversations);
    return conversations;
  }

  function closeSidebarOnMobile() {
    if (isMobileWidth()) {
      document.getElementById('sidebar').classList.remove('mobile-open');
      document.getElementById('sidebar-backdrop').classList.remove('visible');
    }
  }

  async function openConversation(id) {
    currentConversationId = id;
    resetThreadView();

    const response = await fetch('/api/conversations/' + id);
    if (response.ok) {
      const data = await response.json();
      if (data.messages && data.messages.length > 0) {
        showThreadView();
        for (const entry of data.messages) {
          const text = entry.parts?.[0]?.text || '';
          addMessage(text, entry.role === 'user' ? 'user' : 'bot');
        }
      }
    }

    await refreshSidebar();
    closeSidebarOnMobile();
    input.focus();
  }

  async function createNewConversation() {
    const response = await fetch('/api/conversations', {
      method: 'POST'
    });
    if (!response.ok) return;
    const data = await response.json();
    currentConversationId = data.id;
    resetThreadView();
    await refreshSidebar();
    closeSidebarOnMobile();
    input.focus();
  }

  // ===================== SENDING MESSAGES =====================
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const message = input.value.trim();
    if (!message) return;

    // If no conversation is open yet, create one first
    if (!currentConversationId) {
      await createNewConversation();
    }

    showThreadView();
    addMessage(message, 'user');
    input.value = '';
    sendBtn.disabled = true;

    const typingRow = addTypingIndicator();

    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ conversationId: currentConversationId, message })
      });

      if (!response.ok) {
        const errorData = await response.json().catch(() => null);
        const messageText = errorData?.error || 'Erreur de communication.';
        typingRow.remove();
        addMessage(messageText, 'bot');
        return;
      }

      const data = await response.json();
      typingRow.remove();

      if (data.reply) {
        addMessage(data.reply, 'bot');
        await refreshSidebar(); // title may have just been set from the first message
      } else {
        addMessage('Désolé, quelque chose a mal tourné. Veuillez réessayer.', 'bot');
      }
    } catch (err) {
      typingRow.remove();
      addMessage('Erreur de connexion. Veuillez réessayer.', 'bot');
    } finally {
      input.focus();
    }
  });

  // ===================== ENTER APP AFTER LOGIN =====================
  async function startApp() {
    document.getElementById('app').classList.add('visible');

    const conversations = await refreshSidebar();

    if (conversations.length > 0) {
      await openConversation(conversations[0].id);
    } else {
      currentConversationId = null;
      resetThreadView();
    }

    input.focus();
  }

  startApp();
</script>

</body>
</html>
