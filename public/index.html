<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neniou AI — Asistan vityèl ki pale lang ou</title>
<meta name="description" content="Neniou AI, yon asistan vityèl ki reponn nan Kreyòl, franse, oswa angle. Poze kesyon, voye dokiman, oswa yon imaj — gratis, san kont.">
<link rel="icon" href="/assets/icon.svg">

<!-- Open Graph / social preview -->
<meta property="og:title" content="Neniou AI — Asistan vityèl ki pale lang ou">
<meta property="og:description" content="Yon asistan AI ki reponn nan Kreyòl, franse, oswa angle. Poze kesyon, voye dokiman, oswa yon imaj — gratis, san kont.">
<meta property="og:type" content="website">
<meta property="og:image" content="/assets/icon.svg">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Neniou AI">
<meta name="twitter:description" content="Yon asistan AI ki pale Kreyòl, franse, ak angle.">

<!-- Markdown rendering + code syntax highlighting for bot replies -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f11;
    --bg-elevated: #1b1c1f;
    --bg-input: #1e1f22;
    --bg-hover: #262729;
    --border: #303134;
    --text: #e3e3e3;
    --text-dim: #9aa0a6;
    --accent-blue: #4a8fe7;
    --accent-teal: #2fbf9f;
    --accent-green: #34c98a;
    --error: #f28b82;
    --radius: 26px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', 'Google Sans', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    height: 100vh;
    overflow: hidden;
  }

  /* ================= APP (CHAT) ================= */
  .app { display: flex; height: 100vh; }

  /* ---- Sidebar with conversation list ---- */
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    padding: 16px 12px;
    border-right: 1px solid var(--border);
    transition: width .2s ease, padding .2s ease, opacity .15s ease;
    overflow: hidden;
  }
  .sidebar.collapsed {
    width: 0;
    padding-left: 0;
    padding-right: 0;
    border-right: none;
    opacity: 0;
    pointer-events: none;
  }

  .sidebar-top { display: flex; align-items: center; gap: 10px; padding: 4px 6px 18px; }
  .sidebar-top img { width: 26px; height: 26px; object-fit: contain; }
  .sidebar-top span { font-weight: 600; font-size: 0.95rem; }

  .new-chat-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 0.88rem;
    font-family: inherit;
    cursor: pointer;
    margin-bottom: 14px;
    transition: background .15s;
  }
  .new-chat-btn:hover { background: var(--bg-hover); }
  .new-chat-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

  .conversation-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .conversation-list::-webkit-scrollbar { width: 5px; }
  .conversation-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

  .conversation-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 10px 9px 12px;
    border-radius: 10px;
    font-size: 0.85rem;
    color: var(--text-dim);
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .conversation-item:hover { background: var(--bg-elevated); color: var(--text); }
  .conversation-item.active { background: var(--bg-elevated); color: var(--text); }

  .conversation-title {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .conversation-title[contenteditable="true"] {
    outline: 1px solid var(--accent-teal);
    border-radius: 4px;
    padding: 0 2px;
    white-space: normal;
  }

  .conversation-actions { display: none; gap: 2px; flex-shrink: 0; }
  .conversation-item:hover .conversation-actions,
  .conversation-item.active .conversation-actions { display: flex; }

  .conv-action-btn {
    width: 22px; height: 22px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .conv-action-btn:hover { background: var(--bg-hover); color: var(--text); }
  .conv-action-btn svg { width: 13px; height: 13px; }

  .sidebar-empty { color: var(--text-dim); font-size: 0.78rem; padding: 12px; text-align: center; }

  /* ---- Main area ---- */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; }
  .topbar-left { display: flex; align-items: center; gap: 14px; }
  .sidebar-toggle-btn {
    width: 34px; height: 34px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .sidebar-toggle-btn:hover { background: var(--bg-elevated); color: var(--text); }
  .sidebar-toggle-btn svg { width: 20px; height: 20px; }

  .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 20px; }
  .stage.hidden { display: none; }

  .greeting {
    font-family: 'Google Sans', 'Inter', sans-serif;
    font-size: clamp(1.7rem, 4vw, 2.4rem);
    font-weight: 400;
    text-align: center;
    margin: 0 0 32px;
    background: linear-gradient(100deg, var(--accent-blue) 10%, var(--accent-teal) 55%, var(--accent-green) 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .thread-wrap { flex: 1; overflow-y: auto; display: flex; justify-content: center; }
  .thread-wrap.hidden { display: none; }

  .thread { width: 100%; max-width: 780px; padding: 24px 20px 12px; display: flex; flex-direction: column; gap: 26px; }

  .msg-row { display: flex; gap: 14px; align-items: flex-start; }
  .msg-row.user { justify-content: flex-end; }

  .msg-avatar {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
    display: flex; align-items: center; justify-content: center;
  }
  .msg-avatar img { width: 16px; height: 16px; object-fit: contain; }

  .bubble { max-width: 74%; padding: 12px 16px; border-radius: 18px; font-size: 0.96rem; line-height: 1.6; white-space: pre-wrap; }
  .msg-row.user .bubble { background: var(--bg-elevated); border: 1px solid var(--border); border-bottom-right-radius: 4px; }
  .msg-row.bot .bubble { background: transparent; padding: 6px 0; color: var(--text); white-space: normal; }

  .bubble.bot-content p { margin: 0 0 10px; }
  .bubble.bot-content p:last-child { margin-bottom: 0; }
  .bubble.bot-content ul, .bubble.bot-content ol { margin: 0 0 10px; padding-left: 22px; }
  .bubble.bot-content li { margin-bottom: 4px; }
  .bubble.bot-content strong { color: #ffffff; }
  .bubble.bot-content a { color: var(--accent-teal); }
  .bubble.bot-content code { background: var(--bg-elevated); padding: 2px 6px; border-radius: 5px; font-size: 0.88em; }

  .code-block-wrap { position: relative; margin: 10px 0; }
  .code-block-wrap pre { margin: 0; border-radius: 10px; border: 1px solid var(--border); }
  .code-block-wrap pre code { background: transparent; padding: 14px !important; display: block; overflow-x: auto; font-size: 0.85em; }
  .copy-code-btn {
    position: absolute; top: 8px; right: 8px;
    background: rgba(255,255,255,0.08); border: 1px solid var(--border);
    color: var(--text-dim); font-size: 0.72rem; padding: 4px 9px; border-radius: 6px;
    cursor: pointer; font-family: inherit;
  }
  .copy-code-btn:hover { color: var(--text); background: rgba(255,255,255,0.14); }

  .bubble-image {
    max-width: 260px;
    max-height: 260px;
    border-radius: 14px;
    display: block;
    margin-bottom: 8px;
    object-fit: cover;
  }

  .typing-dots { display: flex; gap: 5px; padding: 10px 0; }
  .typing-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); animation: bounce 1.1s infinite ease-in-out; }
  .typing-dots span:nth-child(2) { animation-delay: .15s; }
  .typing-dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

  .input-zone { padding: 10px 20px 22px; display: flex; flex-direction: column; align-items: center; gap: 8px; }

  .image-preview-bar {
    width: 100%;
    max-width: 780px;
    display: none;
    align-items: center;
    gap: 10px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 8px 12px;
  }
  .image-preview-bar.visible { display: flex; }
  .image-preview-bar img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
  .image-preview-bar span { flex: 1; font-size: 0.82rem; color: var(--text-dim); }
  .image-preview-remove {
    background: none; border: none; color: var(--text-dim);
    cursor: pointer; font-size: 1.1rem; line-height: 1; padding: 4px;
  }
  .image-preview-remove:hover { color: var(--error); }

  .input-bar {
    width: 100%; max-width: 780px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex; align-items: center; gap: 6px;
    padding: 8px 8px 8px 10px;
    transition: border-color .15s;
  }
  .input-bar:focus-within { border-color: #4a4d51; }
  .input-bar input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-size: 0.98rem; font-family: inherit; padding: 10px 6px;
  }
  .input-bar input::placeholder { color: var(--text-dim); }

  .attach-btn, .send-btn {
    width: 38px; height: 38px; border-radius: 50%; border: none;
    background: var(--bg-elevated); color: var(--text-dim);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    transition: background .15s, color .15s;
  }
  .attach-btn:hover { background: #303134; color: var(--text); }
  .send-btn:not(:disabled):hover { background: #303134; color: var(--text); }
  .send-btn:disabled { opacity: .4; cursor: default; }
  .attach-btn svg, .send-btn svg { width: 18px; height: 18px; }

  .disclaimer { text-align: center; font-size: 0.72rem; color: var(--text-dim); padding-bottom: 14px; }

  @media (max-width: 780px) {
    .bubble { max-width: 88%; }
  }

  @media (max-width: 640px) {
    .sidebar {
      position: fixed;
      top: 0; left: 0;
      height: 100vh;
      width: 260px;
      z-index: 50;
      background: var(--bg);
      box-shadow: 4px 0 24px rgba(0,0,0,0.4);
      transform: translateX(-100%);
      transition: transform .2s ease;
      opacity: 1;
      pointer-events: auto;
      padding: 16px 12px;
      border-right: 1px solid var(--border);
    }
    .sidebar.mobile-open {
      transform: translateX(0);
    }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 40;
    }
    .sidebar-backdrop.visible { display: block; }

    .topbar { padding: 12px 16px; }
    .input-zone { padding: 8px 12px 16px; }
    .input-bar input { font-size: 16px; } /* prevents iOS auto-zoom on focus */
    .thread { padding: 16px 14px 8px; }
    .bubble { max-width: 92%; font-size: 0.94rem; }
  }
</style>
</head>
<body>

<!-- ================= CHAT APP (no accounts — open to anyone) ================= -->
<div class="app" id="app">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <img src="/assets/icon.svg" alt="Neniou AI">
      <span>Neniou AI</span>
    </div>

    <button class="new-chat-btn" onclick="createNewConversation()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
      Nouvelle conversation
    </button>

    <div class="conversation-list" id="conversation-list">
      <div class="sidebar-empty">Aucune conversation pour l'instant</div>
    </div>
  </aside>

  <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="toggleSidebar()"></div>

  <main>
    <div class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle-btn" onclick="toggleSidebar()" title="Afficher/masquer la barre latérale">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
        </button>
      </div>
    </div>

    <div class="stage" id="stage">
      <div class="greeting">Bonjour, que puis-je faire pour vous aujourd'hui ?</div>
    </div>

    <div class="thread-wrap hidden" id="thread-wrap">
      <div class="thread" id="thread"></div>
    </div>

    <div class="input-zone">
      <div class="image-preview-bar" id="image-preview-bar">
        <img id="image-preview-thumb" src="" alt="">
        <span id="image-preview-name"></span>
        <button type="button" class="image-preview-remove" onclick="removeAttachedImage()">✕</button>
      </div>

      <form class="input-bar" id="chat-form">
        <button type="button" class="attach-btn" id="attach-btn" title="Joindre une image ou un document (PDF, Word, Excel, texte)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21.44 11.05l-9.19 9.19a5.5 5.5 0 01-7.78-7.78l9.19-9.19a3.5 3.5 0 014.95 4.95l-9.2 9.19a1.5 1.5 0 01-2.12-2.12l8.49-8.48"/></svg>
        </button>
        <input type="file" id="image-input" accept="image/png,image/jpeg,image/webp,image/heic,image/heif,application/pdf,.docx,.xlsx,.xls,.txt,.csv,.md,.json,.html,.xml,.rtf" style="display:none">
        <input id="chat-input" type="text" placeholder="Écrivez un message pour Neniou AI..." autocomplete="off" />
        <button class="send-btn" id="send-btn" type="submit" disabled aria-label="Envoyer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>
    </div>
    <div class="disclaimer">Neniou AI peut faire des erreurs. Vérifiez les informations importantes.</div>
  </main>

</div>

<script>
  // ===================== ANONYMOUS CLIENT ID =====================
  function getClientId() {
    let id = localStorage.getItem('neniou_client_id');
    if (!id) {
      id = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2));
      localStorage.setItem('neniou_client_id', id);
    }
    return id;
  }
  const CLIENT_ID = getClientId();

  function apiFetch(url, options = {}) {
    const headers = Object.assign({}, options.headers, { 'X-Client-Id': CLIENT_ID });
    return fetch(url, Object.assign({}, options, { headers }));
  }

  // ===================== SIDEBAR TOGGLE =====================
  function isMobileWidth() {
    return window.innerWidth <= 640;
  }

  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('sidebar-backdrop');

    if (isMobileWidth()) {
      sidebar.classList.toggle('mobile-open');
      backdrop.classList.toggle('visible', sidebar.classList.contains('mobile-open'));
    } else {
      sidebar.classList.toggle('collapsed');
      const isCollapsed = sidebar.classList.contains('collapsed');
      localStorage.setItem('neniou_sidebar_collapsed', isCollapsed ? '1' : '0');
    }
  }

  (function restoreSidebarState() {
    if (!isMobileWidth() && localStorage.getItem('neniou_sidebar_collapsed') === '1') {
      document.getElementById('sidebar').classList.add('collapsed');
    }
  })();

  function closeSidebarOnMobile() {
    if (isMobileWidth()) {
      document.getElementById('sidebar').classList.remove('mobile-open');
      document.getElementById('sidebar-backdrop').classList.remove('visible');
    }
  }

  // ===================== CHAT UI HELPERS =====================
  const stage = document.getElementById('stage');
  const threadWrap = document.getElementById('thread-wrap');
  const thread = document.getElementById('thread');
  const form = document.getElementById('chat-form');
  const input = document.getElementById('chat-input');
  const sendBtn = document.getElementById('send-btn');
  const conversationListEl = document.getElementById('conversation-list');
  const attachBtn = document.getElementById('attach-btn');
  const imageInput = document.getElementById('image-input');
  const imagePreviewBar = document.getElementById('image-preview-bar');
  const imagePreviewThumb = document.getElementById('image-preview-thumb');
  const imagePreviewName = document.getElementById('image-preview-name');

  let currentConversationId = null;
  let attachedImage = null; // { mimeType, data (base64, no prefix), previewUrl }

  function updateSendButtonState() {
    const hasText = input.value.trim().length > 0;
    sendBtn.disabled = !hasText && !attachedImage;
  }

  input.addEventListener('input', updateSendButtonState);

  attachBtn.addEventListener('click', () => imageInput.click());

  const DOCX_MIME = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
  const XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  const XLS_MIME = 'application/vnd.ms-excel';
  const EXTENSION_MIME_FALLBACK = {
    docx: DOCX_MIME, xlsx: XLSX_MIME, xls: XLS_MIME,
    txt: 'text/plain', csv: 'text/csv', md: 'text/markdown',
    json: 'application/json', html: 'text/html', xml: 'text/xml', rtf: 'application/rtf'
  };
  const DOCUMENT_MIMES = [DOCX_MIME, XLSX_MIME, XLS_MIME, 'text/plain', 'text/csv', 'text/markdown', 'application/json', 'text/html', 'text/xml', 'application/rtf'];

  function resolveMimeType(file) {
    if (file.type) return file.type;
    const ext = file.name.split('.').pop().toLowerCase();
    return EXTENSION_MIME_FALLBACK[ext] || 'application/octet-stream';
  }

  imageInput.addEventListener('change', () => {
    const file = imageInput.files[0];
    if (!file) return;

    const MAX_BYTES = 10 * 1024 * 1024; // 10MB
    if (file.size > MAX_BYTES) {
      alert("Le fichier est trop grand (max 10 Mo).");
      imageInput.value = '';
      return;
    }

    const mimeType = resolveMimeType(file);
    const isPdf = mimeType === 'application/pdf';
    const isImage = mimeType.startsWith('image/');
    const isDocument = DOCUMENT_MIMES.includes(mimeType);

    if (!isPdf && !isImage && !isDocument) {
      alert('Type de fichier non pris en charge.');
      imageInput.value = '';
      return;
    }

    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result; // "data:<mime>;base64,AAAA..."
      const base64 = dataUrl.split(',')[1];

      // Only images get a real thumbnail — PDFs and documents show a chip instead.
      attachedImage = {
        mimeType,
        data: base64,
        previewUrl: isImage ? dataUrl : null,
        isPdf,
        isDocument,
        fileName: file.name
      };

      if (isImage) {
        imagePreviewThumb.style.display = '';
        imagePreviewThumb.src = dataUrl;
      } else {
        imagePreviewThumb.style.display = 'none';
      }
      imagePreviewName.textContent = (isImage ? '' : '📄 ') + file.name;
      imagePreviewBar.classList.add('visible');
      updateSendButtonState();
    };
    reader.readAsDataURL(file);
  });

  function removeAttachedImage() {
    attachedImage = null;
    imageInput.value = '';
    imagePreviewBar.classList.remove('visible');
    updateSendButtonState();
  }

  function renderMarkdownSafely(text) {
    const rawHtml = marked.parse(text, { breaks: true });
    return DOMPurify.sanitize(rawHtml);
  }

  function enhanceCodeBlocks(container) {
    container.querySelectorAll('pre code').forEach((block) => {
      if (window.hljs) hljs.highlightElement(block);

      const pre = block.parentElement;
      if (pre.parentElement.classList.contains('code-block-wrap')) return;

      const wrap = document.createElement('div');
      wrap.className = 'code-block-wrap';
      pre.parentNode.insertBefore(wrap, pre);
      wrap.appendChild(pre);

      const copyBtn = document.createElement('button');
      copyBtn.className = 'copy-code-btn';
      copyBtn.type = 'button';
      copyBtn.textContent = 'Copier';
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(block.textContent).then(() => {
          copyBtn.textContent = 'Copié !';
          setTimeout(() => { copyBtn.textContent = 'Copier'; }, 1500);
        });
      };
      wrap.appendChild(copyBtn);
    });
  }

  function addMessage(text, role, imageUrl, fileName) {
    const row = document.createElement('div');
    row.className = 'msg-row ' + role;

    if (role === 'bot') {
      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.innerHTML = '<img src="/assets/icon.svg" alt="">';
      row.appendChild(avatar);
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (imageUrl) {
      const img = document.createElement('img');
      img.className = 'bubble-image';
      img.src = imageUrl;
      bubble.appendChild(img);
    } else if (fileName) {
      const chip = document.createElement('div');
      chip.style.cssText = 'display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg-hover);border-radius:10px;margin-bottom:8px;font-size:0.85rem;';
      chip.textContent = '📄 ' + fileName;
      bubble.appendChild(chip);
    }

    if (text) {
      if (role === 'bot') {
        bubble.classList.add('bot-content');
        const contentDiv = document.createElement('div');
        contentDiv.innerHTML = renderMarkdownSafely(text);
        bubble.appendChild(contentDiv);
        enhanceCodeBlocks(contentDiv);
      } else {
        const textNode = document.createElement('div');
        textNode.textContent = text;
        bubble.appendChild(textNode);
      }
    }

    row.appendChild(bubble);
    thread.appendChild(row);
    threadWrap.scrollTop = threadWrap.scrollHeight;
    return bubble;
  }

  function addTypingIndicator() {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.innerHTML = '<img src="/assets/icon.svg" alt="">';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
    row.appendChild(avatar);
    row.appendChild(bubble);
    thread.appendChild(row);
    threadWrap.scrollTop = threadWrap.scrollHeight;
    return row;
  }

  function showThreadView() {
    stage.classList.add('hidden');
    threadWrap.classList.remove('hidden');
  }

  function resetThreadView() {
    thread.innerHTML = '';
    threadWrap.classList.add('hidden');
    stage.classList.remove('hidden');
  }

  // ===================== CONVERSATIONS (sidebar) =====================
  async function loadConversationList() {
    const response = await apiFetch('/api/conversations');
    if (!response.ok) return [];
    const data = await response.json();
    return data.conversations || [];
  }

  function renderConversationList(conversations) {
    conversationListEl.innerHTML = '';

    if (conversations.length === 0) {
      conversationListEl.innerHTML = '<div class="sidebar-empty">Aucune conversation pour le moment</div>';
      return;
    }

    for (const conv of conversations) {
      const item = document.createElement('div');
      item.className = 'conversation-item' + (conv.id === currentConversationId ? ' active' : '');
      item.onclick = () => openConversation(conv.id);

      const titleSpan = document.createElement('span');
      titleSpan.className = 'conversation-title';
      titleSpan.textContent = conv.title || 'New chat';
      titleSpan.title = conv.title || 'New chat';
      item.appendChild(titleSpan);

      const actions = document.createElement('div');
      actions.className = 'conversation-actions';

      const renameBtn = document.createElement('button');
      renameBtn.className = 'conv-action-btn';
      renameBtn.title = 'Renommer';
      renameBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>';
      renameBtn.onclick = (e) => {
        e.stopPropagation();
        startRenaming(titleSpan, conv.id, conv.title || 'New chat');
      };
      actions.appendChild(renameBtn);

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'conv-action-btn';
      deleteBtn.title = 'Supprimer';
      deleteBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>';
      deleteBtn.onclick = (e) => {
        e.stopPropagation();
        deleteConversation(conv.id);
      };
      actions.appendChild(deleteBtn);

      item.appendChild(actions);
      conversationListEl.appendChild(item);
    }
  }

  function startRenaming(titleSpan, conversationId, currentTitle) {
    titleSpan.contentEditable = 'true';
    titleSpan.focus();

    const range = document.createRange();
    range.selectNodeContents(titleSpan);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);

    async function commit() {
      titleSpan.contentEditable = 'false';
      const newTitle = titleSpan.textContent.trim() || currentTitle;
      titleSpan.textContent = newTitle;
      if (newTitle !== currentTitle) {
        try {
          await apiFetch('/api/conversations/' + conversationId, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: newTitle })
          });
        } catch (err) {
          console.error('Rename failed', err);
        }
      }
    }

    titleSpan.onblur = commit;
    titleSpan.onkeydown = (e) => {
      if (e.key === 'Enter') { e.preventDefault(); titleSpan.blur(); }
      if (e.key === 'Escape') { titleSpan.textContent = currentTitle; titleSpan.blur(); }
    };
  }

  async function deleteConversation(conversationId) {
    if (!confirm('Supprimer cette conversation ?')) return;

    await apiFetch('/api/conversations/' + conversationId, { method: 'DELETE' });

    if (conversationId === currentConversationId) {
      currentConversationId = null;
      resetThreadView();
    }
    await refreshSidebar();
  }

  async function refreshSidebar() {
    const conversations = await loadConversationList();
    renderConversationList(conversations);
    return conversations;
  }

  async function openConversation(id) {
    currentConversationId = id;
    resetThreadView();

    const response = await apiFetch('/api/conversations/' + id);
    if (response.ok) {
      const data = await response.json();
      if (data.messages && data.messages.length > 0) {
        showThreadView();
        for (const entry of data.messages) {
          const text = entry.parts?.[0]?.text || '';
          addMessage(text, entry.role === 'user' ? 'user' : 'bot');
        }
      }
    }

    await refreshSidebar();
    closeSidebarOnMobile();
    input.focus();
  }

  async function createNewConversation() {
    const response = await apiFetch('/api/conversations', { method: 'POST' });
    if (!response.ok) return;
    const data = await response.json();
    currentConversationId = data.id;
    resetThreadView();
    await refreshSidebar();
    closeSidebarOnMobile();
    input.focus();
  }

  // ===================== SENDING MESSAGES =====================
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const message = input.value.trim();
    if (!message && !attachedImage) return;

    if (!currentConversationId) {
      await createNewConversation();
    }

    showThreadView();
    addMessage(
      message,
      'user',
      attachedImage ? attachedImage.previewUrl : null,
      attachedImage && (attachedImage.isPdf || attachedImage.isDocument) ? attachedImage.fileName : null
    );

    const fileToSend = attachedImage;
    input.value = '';
    removeAttachedImage();
    sendBtn.disabled = true;

    const typingRow = addTypingIndicator();

    try {
      const body = { conversationId: currentConversationId, message };
      if (fileToSend) {
        if (fileToSend.isDocument) {
          body.document = { mimeType: fileToSend.mimeType, data: fileToSend.data, fileName: fileToSend.fileName };
        } else {
          body.image = { mimeType: fileToSend.mimeType, data: fileToSend.data };
        }
      }

      const response = await apiFetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      if (!response.ok) {
        const errorData = await response.json().catch(() => null);
        typingRow.remove();
        addMessage(errorData?.error || 'Erreur de communication.', 'bot');
        return;
      }

      const data = await response.json();
      typingRow.remove();

      if (data.reply) {
        addMessage(data.reply, 'bot');
        await refreshSidebar();
      } else {
        addMessage('Désolé, quelque chose a mal tourné. Veuillez réessayer.', 'bot');
      }
    } catch (err) {
      typingRow.remove();
      addMessage('Erreur de connexion. Veuillez réessayer.', 'bot');
    } finally {
      input.focus();
    }
  });

  // ===================== STARTUP =====================
  async function startApp() {
    const conversations = await refreshSidebar();

    if (conversations.length > 0) {
      await openConversation(conversations[0].id);
    } else {
      currentConversationId = null;
      resetThreadView();
    }

    input.focus();
  }

  startApp();
</script>
