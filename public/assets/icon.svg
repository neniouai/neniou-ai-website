<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="orbGrad" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#7fc4ff"/>
      <stop offset="35%" stop-color="#4a8fe7"/>
      <stop offset="70%" stop-color="#2fbf9f"/>
      <stop offset="100%" stop-color="#249e73"/>
    </radialGradient>
    <radialGradient id="orbHighlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Simple glowing orb mark — minimal, premium, no star/sparkle, no bubble -->
  <circle cx="32" cy="32" r="26" fill="url(#orbGrad)"/>
  <ellipse cx="24" cy="22" rx="14" ry="10" fill="url(#orbHighlight)"/>
</svg>
